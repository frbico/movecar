name: Build configured MoveCar owner APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_CONFIG_B64: ${{ secrets.MOVECAR_GOOGLE_SERVICES_JSON_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate Firebase configuration secret
        run: |
          if [ -z "$FIREBASE_CONFIG_B64" ]; then
            echo 'Missing repository Actions secret MOVECAR_GOOGLE_SERVICES_JSON_B64'
            exit 1
          fi
          printf '%s' "$FIREBASE_CONFIG_B64" | base64 -d > android-owner/app/google-services.json
          python3 - <<'PY'
          import json
          with open('android-owner/app/google-services.json', encoding='utf-8') as f:
              config = json.load(f)
          assert any(c.get('client_info',{}).get('android_client_info',{}).get('package_name')=='com.example.movecarvoice' for c in config.get('client',[])), 'The Android package must be com.example.movecarvoice'
          print('Firebase configuration validated (values not printed)')
          PY
      - name: Build installable debug APK
        working-directory: android-owner
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload configured APK
        uses: actions/upload-artifact@v4
        with:
          name: movecar-owner-configured-debug-apk
          path: android-owner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
