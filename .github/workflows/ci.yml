name: CI
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify executable scripts, syntax and integration
        run: |
          test -x install.sh && test -x run-linux.sh && test -x scripts/fetch-upstream.sh && test -x show-admin-password.sh
          bash -n install.sh run-linux.sh show-admin-password.sh scripts/fetch-upstream.sh
          node --check server.mjs
          node --check admin.js
          bash scripts/fetch-upstream.sh
          node --test tests/*.test.mjs
      - name: Verify Docker build
        run: |
          docker build -t movecar:ci .
