name: CI
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify executable scripts, syntax and integration
        run: |
          test -x install.sh && test -x run-linux.sh && test -x scripts/fetch-upstream.sh && test -x show-admin-password.sh
          bash -n install.sh run-linux.sh show-admin-password.sh scripts/fetch-upstream.sh scripts/setup-voice-fresh.sh scripts/export-db.sh scripts/install-universal.sh scripts/supervise-turn.sh scripts/check-portable.sh scripts/restore-db.sh
          python3 -m py_compile scripts/test-voice-endpoints.py scripts/turn-probe.py
          python3 scripts/turn-probe.py --help
          docker compose -f compose.yaml -f compose.portable.yaml config --quiet
          node --check infrastructure.mjs
          node --check server.mjs
          node --check voice-service.mjs
          node --check voice-page.js
          node --check admin.js
          node --check request-flow.mjs
          node --check request-ui.js
          node --check owner-view.js
          bash scripts/fetch-upstream.sh
          node --test tests/*.test.mjs
      - name: Verify Docker build and runtime startup
        run: |
          docker build -t movecar:ci .
          docker run --rm -d --name movecar-ci -p 127.0.0.1:18888:8888 movecar:ci
          trap 'docker rm -f movecar-ci >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18888/healthz >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            docker ps -a --filter name=movecar-ci
            docker logs movecar-ci || true
            echo 'Container failed to start and serve /healthz'
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:18888/request-ui.js | grep -q photoChooseBtn
          curl --fail --silent http://127.0.0.1:18888/owner-view.js | grep -q confirm-move
          curl --fail --silent http://127.0.0.1:18888/admin | grep -q MoveCar

  turn-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot portable Docker stack and verify real TURN UDP allocate
        run: |
          bash scripts/fetch-upstream.sh
          mkdir -p data/turn/tls
          cp scripts/supervise-turn.sh data/turn/supervise-turn.sh
          chmod 755 data/turn/supervise-turn.sh
          sudo chown -R 1000:1000 data/turn
          python3 - <<'PY'
          from pathlib import Path
          with open('.env','w') as fd:
              print('VOICE_TURN_SHARED_SECRET='+'a'*64,file=fd)
              print('VOICE_PAIRING_SECRET='+'b'*64,file=fd)
              print('TURN_EXTERNAL_IP=127.0.0.1',file=fd)
          PY
          trap 'docker compose -f compose.yaml -f compose.portable.yaml logs --tail=100; docker compose -f compose.yaml -f compose.portable.yaml down' EXIT
          docker compose -f compose.yaml -f compose.portable.yaml up -d --build movecar
          docker compose -f compose.yaml -f compose.portable.yaml logs --tail=40 movecar
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8888/healthz >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8888/healthz
          docker compose -f compose.yaml -f compose.portable.yaml up -d coturn
          sleep 5
          python3 scripts/turn-probe.py --host 127.0.0.1 --secret-env-file .env --no-tls
