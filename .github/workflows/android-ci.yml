name: Android debug APK
on:
  push:
    branches: [feature/native-screen-off-voip]
    paths:
      - 'android-owner/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android-owner/**'
      - '.github/workflows/android-ci.yml'
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create build-only Firebase placeholder
        run: |
          cat > android-owner/app/google-services.json <<'JSON'
          {
            "project_info":{"project_number":"123456789012","project_id":"movecar-build-placeholder"},
            "client":[{
              "client_info":{"mobilesdk_app_id":"1:123456789012:android:0123456789abcdef01234567","android_client_info":{"package_name":"com.example.movecarvoice"}},
              "api_key":[{"current_key":"placeholder-compile-only-not-real"}]
            }],
            "configuration_version":"1"
          }
          JSON
      - name: Compile Android owner app
        working-directory: android-owner
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload CI-only debug APK (Firebase is a placeholder)
        uses: actions/upload-artifact@v4
        with:
          name: movecar-owner-ci-debug-UNCONFIGURED
          path: android-owner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
