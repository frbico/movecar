# 1Panel is the only HTTPS reverse proxy and certificate manager.
# Run: docker compose -f compose.yaml -f compose.hk.yaml up -d --build
# 1Panel OpenResty in host network: proxy to http://127.0.0.1:8888
# 1Panel OpenResty on 1panel-network: proxy to http://movecar:8888
services:
  movecar:
    networks:
      - default
      - onepanel

  coturn:
    image: coturn/coturn:4.18.0
    container_name: movecar-hk-turn
    network_mode: host
    restart: unless-stopped
    command: ["-c", "/etc/coturn/turnserver.conf", "--log-file=stdout"]
    volumes:
      - ./deployment/onepanel/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./data/onepanel/turn-tls:/etc/coturn/tls:ro

networks:
  onepanel:
    name: 1panel-network
    external: true
