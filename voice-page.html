<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>呼叫车主</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;min-height:100dvh;
background:linear-gradient(145deg,#169be3,#39a9dc 48%,#82cbc3);color:#14333e;
display:grid;place-items:center;padding:18px}
main{background:#fff;max-width:430px;width:100%;padding:32px 22px 26px;border-radius:24px;text-align:center;
box-shadow:0 12px 30px rgba(13,66,85,.13)}
.call-graphic{font-size:54px;margin:0 0 18px}
h1{font-size:25px;line-height:1.3;font-weight:800;margin:0 0 28px;color:#153c48}
p{line-height:1.55;color:#50636d}
#status{font-size:19px;font-weight:700;min-height:28px;margin:12px 0}
#timer{font-size:15px;font-variant-numeric:tabular-nums;min-height:22px;margin:10px 0 22px}
button{border:0;min-height:56px;padding:15px 20px;border-radius:14px;font-size:17px;
font-weight:750;width:100%;margin-top:12px;cursor:pointer}
#start{background:linear-gradient(110deg,#0a9884,#087c6d);color:#fff}
#hangup{background:#b53e47;color:#fff}
[hidden]{display:none!important}
button:focus-visible{outline:3px solid #39bba3;outline-offset:3px}
</style></head><body>
<main>
<div class="call-graphic" aria-hidden="true">📞</div>
<h1 id="title">呼叫车主</h1>
<p id="status" role="status" aria-live="polite">准备就绪</p>
<p id="timer" aria-live="off"></p>
<button id="start">开始呼叫</button>
<button id="hangup" hidden>挂断通话</button>
<audio id="remote" autoplay playsinline></audio>
</main>
<script src="/voice-page.js" defer></script>
</body></html>
