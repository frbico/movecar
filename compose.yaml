services:
  movecar:
    build: .
    container_name: movecar
    restart: unless-stopped
    init: true
    environment:
      PORT: '8888'
      DB_PATH: /app/data/state.sqlite
      SOURCE_PATH: /app/upstream/movecar.js
      VOICE_PAIRING_SECRET: '${VOICE_PAIRING_SECRET:-}'
      FCM_SERVICE_ACCOUNT: /app/data/firebase-service-account.json
      VOICE_TURN_URLS: '${VOICE_TURN_URLS:-}'
      VOICE_TURN_SHARED_SECRET: '${VOICE_TURN_SHARED_SECRET:-}'
    ports:
      - '${HOST_BIND:-0.0.0.0}:${HOST_PORT:-8888}:8888'
    volumes:
      - movecar_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8888/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  movecar_data:
